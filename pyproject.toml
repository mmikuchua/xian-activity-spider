[project]
name = "xian-activities"
version = "2.0.0"
description = "西安公共文化活动数据采集、AI 语义标注与智能推荐"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110,<1.0",
    "uvicorn[standard]>=0.27,<1.0",
    "pydantic>=2.5,<3.0",
    "beautifulsoup4>=4.12,<5.0",
    "selenium>=4.20,<5.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
xian-activities = "xian_activities.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
