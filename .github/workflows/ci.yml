name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run offline tests
        run: python -m unittest discover -s tests -v
      - name: Validate dataset schema
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path("data/activities.json").read_text(encoding="utf-8"))
          assert payload["schema_version"] == 2
          assert len(payload["activities"]) > 100
          for item in payload["activities"]:
              assert item["id"] and item["name"] and item["tags"]["categories"]
          print(f"OK: {len(payload['activities'])} activities")
          PY
